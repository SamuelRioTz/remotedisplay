name: remotedisplay_client
description: Remote Display — our own client (new UI) on top of the flutter_hbb engine.
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: '^3.1.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The engine + all the session plumbing (render, input, multiwindow) is
  # reused as a library. engine/ is NOT touched from here.
  flutter_hbb:
    path: ../engine/rustdesk/flutter

  # The only ones I import directly to build my App/home. Sources = the same
  # as flutter_hbb's to avoid resolution conflicts.
  get: ^4.6.5
  bot_toast: ^4.0.3
  provider: ^6.0.5
  # "Source code" link on the home screen (AGPL §13); same version as flutter_hbb.
  url_launcher: ^6.3.1
  window_manager:
    git:
      url: https://github.com/rustdesk-org/window_manager
  desktop_multi_window:
    git:
      url: https://github.com/rustdesk-org/rustdesk_desktop_multi_window
  # Deep links on mobile (remotedisplay://connection/new/<host>?password=…) — same
  # source as flutter_hbb's to avoid duplicating the resolution.
  uni_links:
    git:
      url: https://github.com/rustdesk-org/uni_links
      path: uni_links
      ref: f416118d843a7e9ed117c7bb7bdc2deda5a9e86f

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.2

# Same overrides as flutter_hbb (flutter_localizations pulls in intl).
dependency_overrides:
  intl: ^0.19.0
  # Android: the engine pins it to 2.0.17; newer versions compile against
  # android-35 and AGP 7.3.1's aapt2 can't read that android.jar.
  flutter_plugin_android_lifecycle: 2.0.17

flutter:
  uses-material-design: true
